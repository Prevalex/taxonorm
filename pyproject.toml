[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonorm"
version = "0.1.0"
description = "Taxonomy normalization, validation, conversion, and visualization tools"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Allex", email = "prevalex@gmail.com" },
]
keywords = [
    "taxonomy",
    "tree",
    "normalization",
    "validation",
    "csv",
    "xlsx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1", "xlrd>=2.0", "xlwt>=1.3"]
graph = ["networkx>=3"]
pandas = ["pandas>=2"]
tree = ["bigtree>=1"]
xml = ["xmltodict>=0.13"]
view = ["rich>=13", "textual>=0.80", "pyvis>=0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["taxonorm*"]
namespaces = false # false = requires __init__.py in a subfolder to be a subpackage

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
taxonorm = ["py.typed"]
