[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonorm"
version = "0.1.0"
description = "Taxonomy normalization tools"
requires-python = ">=3.12"

[project.optional-dependencies]
excel = ["openpyxl>=3.1", "xlrd>=2.0", "xlwt>=1.3"]
xml = ["xmltodict>=0.13"]
view = ["rich>=13", "textual>=0.80", "pyvis>=0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["taxonorm*"]
namespaces = false # false = requires __init__.py in a subfolder to be a subpackage
