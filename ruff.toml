#[tool.ruff]
# Only check files in these directories
#include = ["src/**/*.py", "tests/**/*.py"]
include = ["*.py"]
# Optionally, exclude other directories just in case
exclude = ["zArc"]

[lint]
# Keep the pre-0.16 Ruff baseline explicit so that future changes to Ruff's
# default rule set do not silently change the project's lint policy.
select = ["E4", "E7", "E9", "F"]

# Import sorting is the first intentionally enabled rule family beyond the
# compatibility baseline. Existing findings are deferred until code work resumes.
extend-select = ["I"]
